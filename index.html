let h=`<div class="sec">Leaderboard</div><div class="card" style="padding:10px 14px"><label class="lbl" style="color:var(--muted);margin-bottom:6px" for="lbd">Round</label><select class="in" id="lbd" onchange="LBD=this.value;render()">${days.map(d=>`<option value="${d}"${d==LBD?' selected':''}>${d}${d=='All'?' (whole weekend)':''}</option>`).join('')}</select></div>`;
if(LBD=='All'){const bs=bagStats().slice().sort((a,b)=>(a.totalNet-a.totalPar)-(b.totalNet-b.totalPar));
h+=`<div class="card" style="padding:8px 0 8px 8px"><div class="sgw"><table class="lbt"><thead><tr><th class="l">#</th><th class="l">Player</th><th>Net</th><th>+/-</th><th>Holes</th></tr></thead><tbody>${bs.map((r,i)=>lbRow([i+1,`<span class="pl4 t${r.ti}">${avatar(r.ti,r.pi,r.name,26)}${esc(r.name)}</span>`,r.totalNet,pm2(r.totalNet-r.totalPar),r.holesN])).join('')}</tbody></table></div></div>`;
}else{const bd=dayBoard(LBD);
if(!bd.length)h+=`<div class="card"><p class="mu" style="margin:0">No scores for ${LBD} yet.</p></div>`;
else h+=`<div class="card" style="padding:8px 0 8px 8px"><div class="sgw"><table class="lbt"><thead><tr><th class="l">#</th><th class="l">Player</th><th>F9</th><th>B9</th><th>Tot</th><th>+/-</th><th>Thru</th></tr></thead><tbody>${bd.map((r,i)=>lbRow([i+1,`<span class="pl4 t${r.ti}">${avatar(r.ti,r.pi,r.name,26)}${esc(r.name)}</span>`,r.f9==null?'–':r.f9,r.b9==null?'–':r.b9,r.tot,pm2(r.tot-r.totpar),r.thru+'/18'])).join('')}</tbody></table></div></div>`;
}
return h}
function roundNet(day,ti,pi){const mi=S.matches.findIndex(m=>m.d==day&&m.l[ti].includes(pi));if(mi<0)return null;
const m=S.matches[mi],c=COURSE[day],gross=(S.sc[day]||{})[ti+'_'+pi];if(!gross)return null;
const chVal=c?chd(m,ti,pi):null,nets=[],par=[];
for(let h=0;h<18;h++){const g=gross[h];par.push(c?c.par[h]:4);
 if(g==null){nets.push(null);continue}
 const strokes=(c&&chVal!=null)?gs(chVal,c,h):0;nets.push(g-strokes)}
return{mi,m,c,gross,nets,par}}
function dayPlayerStats(day,ti,pi){const r=roundNet(day,ti,pi);if(!r)return null;const{gross,nets,par}=r;
let totalNet=0,totalPar=0,holesN=0,birdies=0,bad=0,bestStreak=0,curStreak=0,streak=0,bestStart=null,bestStartPar=0,bestFinish=null,bestFinishPar=0;
for(let h=0;h<18;h++){const g=gross[h];if(g==null){curStreak=0;continue}
 const p=par[h],net=nets[h];
 totalNet+=net;totalPar+=p;holesN++;
 if(g==p-1)birdies++;
 if(net>=p+1)bad++;
 if(net==p){curStreak++;if(curStreak>streak)streak=curStreak}else curStreak=0}
if(streak>bestStreak)bestStreak=streak;
if(nets.slice(0,5).every(x=>x!=null)){bestStart=nets.slice(0,5).reduce((a,b)=>a+b,0);bestStartPar=par.slice(0,5).reduce((a,b)=>a+b,0)}
if(nets.slice(13,18).every(x=>x!=null)){bestFinish=nets.slice(13,18).reduce((a,b)=>a+b,0);bestFinishPar=par.slice(13,18).reduce((a,b)=>a+b,0)}
if(!holesN)return null;
return{totalNet,totalPar,holesN,birdies,bad,bestStreak,bestStart,bestStartPar,bestFinish,bestFinishPar}}
function bagStats(){const out=[];
S.teams.forEach((t,ti)=>t.p.forEach((nm,pi)=>{
 let totalNet=0,totalPar=0,holesN=0,birdies=0,bad=0,bestStreak=0,bestStart=null,bestStartPar=0,bestFinish=null,bestFinishPar=0;
 DAYS.forEach(day=>{const d=dayPlayerStats(day,ti,pi);if(!d)return;
  totalNet+=d.totalNet;totalPar+=d.totalPar;holesN+=d.holesN;birdies+=d.birdies;bad+=d.bad;
  if(d.bestStreak>bestStreak)bestStreak=d.bestStreak;
  if(d.bestStart!=null&&(bestStart==null||d.bestStart<bestStart)){bestStart=d.bestStart;bestStartPar=d.bestStartPar}
  if(d.bestFinish!=null&&(bestFinish==null||d.bestFinish<bestFinish)){bestFinish=d.bestFinish;bestFinishPar=d.bestFinishPar}});
 if(holesN)out.push({ti,pi,name:nm,totalNet,totalPar,holesN,birdies,bad,bestStreak,bestStart,bestStartPar,bestFinish,bestFinishPar})}));
return out}
function bagStatsDay(day){const out=[];
S.teams.forEach((t,ti)=>t.p.forEach((nm,pi)=>{const d=dayPlayerStats(day,ti,pi);if(!d)return;
 out.push({ti,pi,name:nm,totalNet:d.totalNet,totalPar:d.totalPar,holesN:d.holesN,birdies:d.birdies,bad:d.bad,bestStreak:d.bestStreak,bestStart:d.bestStart,bestStartPar:d.bestStartPar,bestFinish:d.bestFinish,bestFinishPar:d.bestFinishPar})}));
return out}
function dayBoard(day){const out=[];
S.teams.forEach((t,ti)=>t.p.forEach((nm,pi)=>{const r=roundNet(day,ti,pi);if(!r)return;const{nets,par}=r;
 const sum=(s,e)=>{let n=0,p=0,th=0;for(let h=s;h<e;h++){if(nets[h]==null)continue;n+=nets[h];p+=par[h];th++}return{n,p,th}};
 const f=sum(0,9),b=sum(9,18),tt=sum(0,18);if(!tt.th)return;
 out.push({ti,pi,name:nm,f9:f.th?f.n:null,f9par:f.p,b9:b.th?b.n:null,b9par:b.p,tot:tt.n,totpar:tt.p,thru:tt.th})}));
out.sort((a,b)=>(a.tot-a.totpar)-(b.tot-b.totpar));
return out}
function pm2(v){return v>0?'+'+v:v<0?String(v):'E'}
let LBD='All';
function lbRow(cols){return `<tr>${cols.map((c,i)=>`<td${i==1?' class="l"':''}>${c}</td>`).join('')}</tr>`}
// ===== Ronnie Bass Power Rating (RBPR) engine =====
const RBDEF={h25:.4,h26:.6,prog:[[0,0],[1,.30],[2,.45],[3,.55],[4,.65],[5,.75]],sammatch:.7,hcpperf:.4,winsZ:2.5,scoreSpread:15,eloD:15};
function rbCfg(){return Object.assign({},RBDEF,S.rbpr||{})}
function median(a){if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
function winsor(arr,z){if(arr.length<4)return arr;const m=arr.reduce((a,b)=>a+b,0)/arr.length,sd=Math.sqrt(arr.reduce((a,b)=>a+(b-m)*(b-m),0)/arr.length)||1;return arr.map(v=>Math.max(m-z*sd,Math.min(m+z*sd,v)))}

// Build every "round" (year, roundLabel, course, {player:grossTotal}). daysOK optionally restricts which 2027 days count (for trend snapshots).
function rbRounds(daysOK){const AL={Bradio:'Brad'},rounds=[];
[[2024,SC24],[2025,SC25],[2026,SC26]].forEach(([y,sc])=>{for(let k=0;k<3;k++){const field={};sc.forEach(r=>{const g=r[1+k*2];if(g>0)field[r[0]]=g});
  if(Object.keys(field).length)rounds.push({y,r:k+1,course:(CRS[y]||[])[k]||('Round '+(k+1)),field})}});
DAYS.forEach(day=>{if(daysOK&&!daysOK.includes(day))return;const c=COURSE[day];if(!c)return;const field={};
  S.teams.forEach((t,ti)=>t.p.forEach((nm,pi)=>{const g=(S.sc[day]||{})[ti+'_'+pi];if(g&&g.every(x=>x!=null)){const n=AL[nm]||nm;field[n]=g.reduce((a,b)=>a+b,0)}}));
  if(Object.keys(field).length)rounds.push({y:2027,r:day,course:c.n,field,live:true})});
return rounds}

function rbSam(daysOK){const rounds=rbRounds(daysOK),out=[];
rounds.forEach(rd=>{const names=Object.keys(rd.field),vals=names.map(n=>rd.field[n]),m=median(vals);
  const raw=names.map(n=>rd.field[n]-m),wins=winsor(raw,rbCfg().winsZ);
  names.forEach((n,i)=>out.push({n,y:rd.y,r:rd.r,course:rd.course,gross:rd.field[n],median:m,sam:raw[i],samW:wins[i],live:!!rd.live}))});
return out}

function rbPlayerSam(all,n,year){const rows=all.filter(x=>x.n==n&&x.y==year);
if(!rows.length)return null;const s=rows.map(x=>x.samW);
return{rounds:rows.length,avg:s.reduce((a,b)=>a+b,0)/s.length,best:Math.min(...s),worst:Math.max(...s),median:median(s),rows:rows.sort((a,b)=>(a.r>b.r?1:-1))}}

// Historical (2025+2026 blended) SAM + progressive Historical-vs-2027 blend.
function rbBlend(all,n){const cfg=rbCfg(),y25=rbPlayerSam(all,n,2025),y26=rbPlayerSam(all,n,2026),y27=rbPlayerSam(all,n,2027);
let hist=null;
if(y25&&y26)hist=cfg.h25*y25.avg+cfg.h26*y26.avg;else if(y26)hist=y26.avg;else if(y25)hist=y25.avg;
const n27=y27?y27.rounds:0,capped=Math.min(n27,cfg.prog[cfg.prog.length-1][0]);
const w27=hist==null?(y27?1:0):(cfg.prog.find(p=>p[0]==capped)||cfg.prog[0])[1],wH=1-w27;
const combined=hist==null?(y27?y27.avg:null):(y27?wH*hist+w27*y27.avg:hist);
return{y25,y26,y27,hist,wH:hist==null?0:wH,w27:hist==null?(y27?1:0):w27,combined}}

// Match results: singles + team, points-based, with opponent list for Elo adjustment.
function rbMeetings(daysOK){const AL={Bradio:'Brad'},out=[];
[2025,2026].forEach(y=>{RES[y].s.forEach(([t,rows])=>{rows.forEach(z=>{const A=z[0].split(' / '),B=z[3].split(' / '),tot=z[1]+z[2];if(!tot)return;
  A.forEach(a=>out.push({n:a,y,pts:z[1],max:tot,opp:B}));B.forEach(b=>out.push({n:b,y,pts:z[2],max:tot,opp:A}))})})});
S.matches.forEach(m=>{if(daysOK&&!daysOK.includes(m.d))return;if(!mFin(m))return;let fa=0,fb=0,tot=0;m.s.forEach((r,i)=>{const pv=(m.pv||[])[i]||0;tot+=pv;fa+=r.w=='A'?pv:r.w=='H'?pv/2:0;fb+=r.w=='B'?pv:r.w=='H'?pv/2:0});if(!tot)return;
  const nmL=m.l[0].map(pi=>{const nm=S.teams[0].p[pi];return AL[nm]||nm}),nmG=m.l[1].map(pi=>{const nm=S.teams[1].p[pi];return AL[nm]||nm});
  nmL.forEach(n=>out.push({n,y:2027,pts:fa,max:tot,opp:nmG}));nmG.forEach(n=>out.push({n,y:2027,pts:fb,max:tot,opp:nmL}))});
return out}
function rbMatchRaw(meet,n){const rows=meet.filter(x=>x.n==n);if(!rows.length)return null;
let w=0,l=0,h=0,pts=0,max=0;rows.forEach(r=>{const frac=r.pts/r.max;if(frac>.5+1e-9)w++;else if(frac<.5-1e-9)l++;else h++;pts+=r.pts;max+=r.max});
return{rows,w,l,h,pts,max,pct:max?pts/max:null}}

function rbHandicap(players){const idx=players.map(p=>p.idx).filter(v=>v!=null);
const best=Math.min(...idx),worst=Math.max(...idx);
players.forEach(p=>{const v=p.idx==null?(idx.reduce((a,b)=>a+b,0)/idx.length):p.idx;p.hcpMissing=p.idx==null;p.hcpScore=worst==best?50:100*(worst-v)/(worst-best)});
return{best,worst}}

function rbNormalize(players,key,invert){const v=players.map(p=>p[key]).filter(x=>x!=null);
if(v.length<2){players.forEach(p=>p[key+'Score']=p[key]==null?null:50);return}
const mean=v.reduce((a,b)=>a+b,0)/v.length,sd=Math.sqrt(v.reduce((a,b)=>a+(b-mean)*(b-mean),0)/v.length)||1,cfg=rbCfg();
players.forEach(p=>{if(p[key]==null){p[key+'Score']=null;return}
  let z=(p[key]-mean)/sd;if(invert)z=-z;z=Math.max(-cfg.winsZ,Math.min(cfg.winsZ,z));
  p[key+'Score']=Math.max(1,Math.min(99,50+z*cfg.scoreSpread))})}

// Full two-pass RBPR. daysOK optionally restricts 2027 data (for trend / previous-rank snapshots).
function rbAll(daysOK){const AL={Bradio:'Brad'},cfg=rbCfg(),all=rbSam(daysOK),meet=rbMeetings(daysOK);
const players=[];S.teams.forEach((t,ti)=>t.p.forEach((nm,pi)=>{const n=AL[nm]||nm;players.push({ti,pi,nm,n,idx:pidx(t.h[pi])})}));
const {best,worst}=rbHandicap(players);
players.forEach(p=>{const b=rbBlend(all,p.n);Object.assign(p,{y25:b.y25,y26:b.y26,y27:b.y27,hist:b.hist,wH:b.wH,w27:b.w27,sam:b.combined})});
rbNormalize(players,'sam',true);
players.forEach(p=>{p.perfPass1=p.samScore==null?p.hcpScore:p.samScore;p.rbprPass1=cfg.hcpperf*p.hcpScore+(1-cfg.hcpperf)*p.perfPass1});
const strength={};players.forEach(p=>strength[p.n]=p.rbprPass1);
players.forEach(p=>{const m=rbMatchRaw(meet,p.n);p.match=m;
  if(!m){p.matchScore=null;return}
  let sumDelta=0,n=0;m.rows.forEach(r=>{const opp=r.opp.map(o=>strength[o]).filter(v=>v!=null);if(!opp.length)return;
    const oppAvg=opp.reduce((a,b)=>a+b,0)/opp.length,exp=1/(1+Math.pow(10,-(strength[p.n]-oppAvg)/cfg.eloD)),act=r.pts/r.max;sumDelta+=(act-exp);n++});
  p.matchDelta=n?sumDelta/n:0;p.matchScore=n?Math.max(1,Math.min(99,50+p.matchDelta*100)):null});
players.forEach(p=>{const hasMatch=p.matchScore!=null;
  p.perf=hasMatch?cfg.sammatch*(p.samScore==null?50:p.samScore)+(1-cfg.sammatch)*p.matchScore:(p.samScore==null?p.hcpScore:p.samScore);
  p.rbpr=cfg.hcpperf*p.hcpScore+(1-cfg.hcpperf)*p.perf;
  let hcpC=cfg.hcpperf*p.hcpScore,histC=0,c27=0,matchC=0;
  if(p.samScore!=null){const sub=(1-cfg.hcpperf)*(hasMatch?cfg.sammatch:1);histC=sub*p.wH*p.samScore;c27=sub*p.w27*p.samScore;if(hasMatch)matchC=(1-cfg.hcpperf)*(1-cfg.sammatch)*p.matchScore}
  else{hcpC=p.rbpr} // no SAM history and no match yet: ranked on handicap alone, full weight shown as handicap
  p.contrib={hcp:hcpC,hist:histC,y27:c27,match:matchC}});
players.forEach(p=>p.noData=p.samScore==null&&p.matchScore==null);
players.sort((a,b)=>(a.noData-b.noData)||b.rbpr-a.rbpr||b.hcpScore-a.hcpScore);players.forEach((p,i)=>p.rank=i+1);
return{players,all,meet,best,worst,cfg}}

// Chronological RBPR snapshots per completed 2027 day, for trend charts / previous-rank.
function rbTrend(n){const done=DAYS.filter(d=>{const ms=S.matches.filter(m=>m.d==d);return ms.length&&ms.every(m=>mFin(m))});
const snaps=[];
for(let i=0;i<=done.length;i++){const r=rbAll(done.slice(0,i));const me=r.players.find(p=>p.n==n);
  snaps.push({label:i==0?'Preseason':done[i-1],rbpr:me?+me.rbpr.toFixed(1):null,rank:me?me.rank:null})}
return snaps}

function rbTags(p){const K=[['samScore','Strong SAM'],['hcpScore','Low handicap'],['matchScore','Match play closer']];
return K.filter(([k])=>p[k]!=null&&p[k]>=64).sort((a,b)=>p[b[0]]-p[a[0]]).slice(0,2).map(x=>x[1])}
function rbSvg(snaps){const w=320,h=110,pad=26,vals=snaps.map(s=>s.rbpr).filter(v=>v!=null);
if(vals.length<2)return `<p class="mu" style="margin:0">Not enough rounds yet for a trend line.</p>`;
const mn=Math.min(...vals)-3,mx=Math.max(...vals)+3,n=snaps.length,x=i=>pad+(w-2*pad)*(n==1?0:i/(n-1)),y=v=>h-pad+ (pad-h+pad)*0+ (h-2*pad)*(1-(v-mn)/(mx-mn||1))+pad*0;
const yy=v=>pad+(h-2*pad)*(1-(v-mn)/(mx-mn||1));
const pts=snaps.map((s,i)=>s.rbpr==null?null:[x(i),yy(s.rbpr)]);
const path=pts.filter(Boolean).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const dots=pts.map((p,i)=>p?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--teal)"></circle>`:'').join('');
const labels=snaps.map((s,i)=>`<text x="${x(i).toFixed(1)}" y="${h-6}" font-size="9" fill="var(--muted)" text-anchor="middle">${esc(String(s.label).slice(0,3))}</text>`).join('');
return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="var(--teal)" stroke-width="2.5"></path>${dots}${labels}</svg>`}

function rbBar(label,val,color){return `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)"><span>${esc(label)}</span><span>${val.toFixed(1)}</span></div><div class="pwb"><i style="width:${Math.max(0,Math.min(100,val))}%;background:${color||'var(--teal)'}"></i></div></div>`}

function rbTeamPower(res){const teams=[0,1].map(ti=>{const ps=res.players.filter(p=>p.ti==ti),pr=ps.filter(p=>!p.noData),r=(pr.length?pr:ps).map(p=>p.rbpr),s=r.slice().sort((a,b)=>a-b);
  return{ti,n:S.teams[ti].n,avg:r.reduce((a,b)=>a+b,0)/r.length,med:s.length%2?s[s.length>>1]:(s[s.length/2-1]+s[s.length/2])/2,tot:r.reduce((a,b)=>a+b,0),
    avgHcp:ps.filter(p=>p.idx!=null).reduce((a,p,_,arr)=>a+p.idx/arr.length,0),avgSam:(()=>{const v=ps.filter(p=>p.sam!=null).map(p=>p.sam);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null})()}});
const pts=calc().t;
const block=t=>`<div style="border-top:6px solid var(--${V(t.ti)});border-radius:14px;background:var(--card2,var(--card));padding:14px;margin-bottom:${t.ti?0:10}px"><div style="font:800 18px 'Barlow Condensed',sans-serif;text-transform:uppercase;margin-bottom:10px">${esc(t.n)}</div><div class="g3" style="grid-template-columns:repeat(2,1fr);gap:12px 10px"><span><b>${t.avg.toFixed(1)}</b>Avg RBPR</span><span><b>${t.med.toFixed(1)}</b>Median RBPR</span><span><b>${t.tot.toFixed(0)}</b>Combined RBPR</span><span><b>${t.avgHcp.toFixed(1)}</b>Avg handicap</span><span><b>${t.avgSam==null?'\u2013':(t.avgSam>=0?'+':'')+t.avgSam.toFixed(1)}</b>Avg SAM</span><span><b>${pts[t.ti]}</b>Match points</span></div></div>`;
const unr=res.players.filter(p=>p.noData).length;return `<div class="card"><h2>Team Power Rankings</h2>${teams.map(block).join('')}${unr?`<p class="mu" style="margin:10px 0 0">${unr==1?'One unrated player is':unr+' unrated players are'} left out of the RBPR averages.</p>`:''}</div>`}

function rbConfigCard(){const cfg=rbCfg();
const row=(lbl,key,step)=>`<div class="lr"><div class="ln"><b>${esc(lbl)}</b></div><input class="in nv" style="width:80px" type="number" step="${step||0.05}" value="${cfg[key]}" oninput="S.rbpr=S.rbpr||{};S.rbpr.${key}=parseFloat(this.value)||0;save();render()"></div>`;
const progRow=(i)=>`<div class="lr"><div class="ln"><b>After ${cfg.prog[i][0]} 2027 round${cfg.prog[i][0]==1?'':'s'}</b><small>Weight given to 2027 vs historical</small></div><input class="in nv" style="width:80px" type="number" step="0.05" min="0" max="1" value="${cfg.prog[i][1]}" oninput="S.rbpr=S.rbpr||{};S.rbpr.prog=(S.rbpr.prog||JSON.parse('${JSON.stringify(cfg.prog)}'));S.rbpr.prog[${i}][1]=parseFloat(this.value)||0;save();render()"></div>`;
return `<div class="card"><h2>Power Ranking settings</h2><p class="mu">These control the Ronnie Bass Power Rating (RBPR) shown in Power Rankings. Changes apply immediately.</p>
<div class="sec" style="margin:10px 2px 4px;font-size:13px">Historical split (2025 vs 2026)</div>${row('2025 weight','h25')}${row('2026 weight','h26')}
<div class="sec" style="margin:14px 2px 4px;font-size:13px">2027 phase-in (rounds played \u2192 2027 weight)</div>${cfg.prog.map((_,i)=>progRow(i)).join('')}
<div class="sec" style="margin:14px 2px 4px;font-size:13px">Top-level formula</div>${row('Handicap vs performance (handicap share)','hcpperf')}${row('SAM vs match play (SAM share)','sammatch')}
<div class="sec" style="margin:14px 2px 4px;font-size:13px">Outlier protection</div>${row('Winsorize clip (standard deviations)','winsZ',.1)}${row('Score spread (points per std dev)','scoreSpread',1)}
<button class="add" style="margin-top:10px" onclick="S.rbpr={};save();render()">Reset to defaults</button></div>`}

function rbDetail(ti,pi){const res=rbAll(),p=res.players.find(x=>x.ti==ti&&x.pi==pi);if(!p)return `<p class="mu">Player not found.</p>`;
const trend=rbTrend(p.n),nm=S.teams[ti].p[pi];

// ---- Pairing tool: current round only, avoids repeat trios/partners/opponents (this weekend weighted heavily, history lightly) ----
function rbCombos(arr,k){const out=[];(function rec(st,cur){if(cur.length==k){out.push(cur.slice());return}for(let i=st;i<arr.length;i++){cur.push(arr[i]);rec(i+1,cur);cur.pop()}})(0,[]);return out}
function rbPermutations(n){const idx=[...Array(n).keys()],res=[];(function rec(a,used){if(a.length==n){res.push(a.slice());return}for(let i=0;i<n;i++){if(used[i])continue;used[i]=1;a.push(i);rec(a,used);a.pop();used[i]=0}})([],Array(n).fill(0));return res}

// Names actually applied together (partners or opponents) in real, lineup-set 2027 matches so far, keyed 'A|B' (sorted).
function rbWeekendPairs(skipDay){const AL={Bradio:'Brad'},counts={};
const add=(a,b,w)=>{const k=[a,b].sort().join('|');counts[k]=(counts[k]||0)+w};
S.matches.forEach(m=>{if(!m.l[0].length||!m.l[1].length||m.d===skipDay)return;
  const A=m.l[0].map(pi=>{const n=S.teams[0].p[pi];return AL[n]||n}),B=m.l[1].map(pi=>{const n=S.teams[1].p[pi];return AL[n]||n});
  A.forEach((a,i)=>A.slice(i+1).forEach(a2=>add(a,a2,3))); // partners, same side
  B.forEach((b,i)=>B.slice(i+1).forEach(b2=>add(b,b2,3)));
  A.forEach(a=>B.forEach(b=>add(a,b,3)))}); // opponents
return counts}
// Historical (2025/2026 + any finished 2027) meetings, lighter weight, via existing rbMeetings().
function rbHistPairs(){const counts={},add=(a,b,w)=>{const k=[a,b].sort().join('|');counts[k]=(counts[k]||0)+w};
rbMeetings().forEach(m=>m.opp.forEach(o=>add(m.n,o,1)));
return counts}
function rbFamiliarity(skipDay){const wk=rbWeekendPairs(skipDay),hist=rbHistPairs(),keys=new Set([...Object.keys(wk),...Object.keys(hist)]);
const out={};keys.forEach(k=>out[k]=(wk[k]||0)+(hist[k]||0));return{wk,hist,fam:out,get:(a,b)=>{const k=[a,b].sort().join('|');return(wk[k]||0)+(hist[k]||0)}}}

// Who's already been in a 3v3 trio this weekend (from actual, applied lineups on earlier days).
function rbTrioAlumni(beforeDay){const AL={Bradio:'Brad'},set=new Set(),idx=DAYS.indexOf(beforeDay);
S.matches.forEach(m=>{if(DAYS.indexOf(m.d)>=idx)return;if(m.n!=3)return;if(!m.l[0].length&&!m.l[1].length)return;
  m.l.forEach((l,ti)=>l.forEach(pi=>{const n=S.teams[ti].p[pi];set.add(AL[n]||n)}))});
return set}

function rbSuggestBestBall(res,day){const P=res.players,L=P.filter(p=>p.ti==0),G=P.filter(p=>p.ti==1);
if(L.length!=G.length||L.length<7)return null;
const fam=rbFamiliarity(day),trioAlumni=rbTrioAlumni(day);
const groupings=team=>{const out=[];rbCombos(team,3).forEach(tr=>{const rest=team.filter(p=>!tr.includes(p));[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]].forEach(sp=>out.push({tr,p1:sp[0].map(i=>rest[i]),p2:sp[1].map(i=>rest[i])}))});return out};
const gl=groupings(L),gg=groupings(G);
const famPenalty=(g1,g2)=>{let s=0;g1.forEach(a=>g2.forEach(b=>s+=fam.get(a.n,b.n)));return s};
const withinPenalty=g=>{let s=0;for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++)s+=fam.get(g[i].n,g[j].n);return s};
let best=null;
gl.forEach(a=>gg.forEach(b=>[[0,1],[1,0]].forEach(([x,y])=>{
  const m1=[a.p1,b[x?'p2':'p1']],m2=[a.p2,b[x?'p1':'p2']],m3=[a.tr,b.tr];
  const sum=g=>g.reduce((s,p)=>s+p.rbpr,0);
  const diffs=[m1,m2,m3].map(m=>Math.abs(sum(m[0])-sum(m[1])));
  const balance=diffs.reduce((s,d)=>s+d*d,0);
  const repeat=famPenalty(m1[0],m1[1])*4+withinPenalty(m1[0])*4+withinPenalty(m1[1])*4
    +famPenalty(m2[0],m2[1])*4+withinPenalty(m2[0])*4+withinPenalty(m2[1])*4
    +famPenalty(m3[0],m3[1])*4+withinPenalty(m3[0])*4+withinPenalty(m3[1])*4;
  const trioRepeat=[...a.tr,...b.tr].filter(p=>trioAlumni.has(p.n)).length*300;
  const score=balance+repeat+trioRepeat;
  if(!best||score<best.score)best={matches:[m1,m2,m3],diffs,score,trioRepeat}})));
return best}

function rbSuggestSingles(res,day){const P=res.players,L=P.filter(p=>p.ti==0),G=P.filter(p=>p.ti==1);
if(L.length!=G.length)return null;
const fam=rbFamiliarity(day);let best=null;
rbPermutations(L.length).forEach(perm=>{let obj=0,rep=0;perm.forEach((gi,li)=>{const d=L[li].rbpr-G[gi].rbpr;obj+=d*d;rep+=fam.get(L[li].n,G[gi].n)*500});
  const score=obj+rep;if(!best||score<best.score)best={perm,score}});
const matches=best.perm.map((gi,li)=>[[L[li]],[G[gi]]]);
return{matches,diffs:matches.map(m=>Math.abs(m[0][0].rbpr-m[1][0].rbpr))}}

// Sunday physical playing groups (4,4,3,3), independent of who's actually paired 1v1 for scoring -
// maximizes new company: greedy, minimizes total familiarity (this weekend weighted heavy) within each group.
function rbSundayGroups(matches){const fam=rbFamiliarity(),all=[];matches.forEach(m=>{all.push(m[0][0]);all.push(m[1][0])});
const order=all.slice().sort((a,b)=>{let sa=0,sb=0;all.forEach(x=>{sa+=fam.get(a.n,x.n);sb+=fam.get(b.n,x.n)});return sb-sa});
const sizes=[4,4,3,3],groups=sizes.map(()=>[]);
order.forEach(p=>{let bestI=-1,bestAdd=Infinity;
  groups.forEach((g,i)=>{if(g.length>=sizes[i])return;let add=0;g.forEach(q=>add+=fam.get(p.n,q.n));if(add<bestAdd){bestAdd=add;bestI=i}});
  if(bestI>=0)groups[bestI].push(p)});
return groups}

function rbSug(day){return day=='Sunday'?rbSuggestSingles(rbAll(),day):rbSuggestBestBall(rbAll(),day)}
function rbGuard(day,idxs){const targets=S.matches.filter(x=>x.d==day),o=S.sc[day]||{};for(const i of idxs){const m=targets[i];if(!m)continue;
  const has=[0,1].some(ti=>m.l[ti].some(pi=>(o[ti+'_'+pi]||[]).some(v=>v!=null)));
  if(has||m.final)return 'Match '+(i+1)+' on '+day+' already has scores'+(m.final?' and was submitted':'')+'. Applying new pairings would leave those scores on the wrong players, so nothing was changed.'}return ''}
function rbApplyPair(i,day){if(VIEWER||STALE||isRO())return;const sug=(PAIRC&&PAIRC.day==day&&PAIRC.sug)||rbSug(day);if(!sug)return;
const msg=rbGuard(day,[i]);if(msg){PAIRMSG=msg;render();return}
const m=sug.matches[i],targets=S.matches.filter(x=>x.d==day);let mi=targets[i]?S.matches.indexOf(targets[i]):-1;if(mi<0)return;
S.matches[mi].l=[m[0].map(p=>p.pi),m[1].map(p=>p.pi)];PAIRMSG='Applied match '+(i+1)+'.';save();render()}
function rbApplyAll(day){if(VIEWER||STALE||isRO())return;const sug=(PAIRC&&PAIRC.day==day&&PAIRC.sug)||rbSug(day);if(!sug)return;
const idx=sug.matches.map((_,i)=>i),msg=rbGuard(day,idx);if(msg){PAIRMSG=msg;render();return}

function pShrink(file,dim,q){return new Promise((res,rej)=>{try{
const url=URL.createObjectURL(file),img=new Image();
img.onload=()=>{try{let w=img.width,h=img.height;const sc=Math.min(1,dim/Math.max(w,h));w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',q))}catch(e){rej(e)}};
img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load failed'))};img.src=url}catch(e){rej(e)}})}
async function pBudget(file){let dim=1400,q=0.75,out=null;
for(let i=0;i<7;i++){out=await pShrink(file,dim,q);if(out.length<=180000)return out;if(i%2==0)q=Math.max(0.35,q-0.15);else dim=Math.max(480,Math.round(dim*0.75))}
return out}
